<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0b0f14"/>
  
  <!-- Circuit trace paths -->
  <g stroke="#39ff88" stroke-width="3" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Main vertical trace from top to keyhole -->
    <polyline points="128,24 128,72"/>
    <!-- Horizontal trace top left -->
    <polyline points="48,48 88,48 88,72 128,72"/>
    <!-- Horizontal trace top right -->
    <polyline points="208,48 168,48 168,72 128,72"/>
    <!-- Left branch -->
    <polyline points="48,128 48,88 88,88 88,112 128,112"/>
    <!-- Right branch -->
    <polyline points="208,128 208,88 168,88 168,112 128,112"/>
    <!-- Bottom left trace -->
    <polyline points="48,208 48,168 88,168 88,144 128,144"/>
    <!-- Bottom right trace -->
    <polyline points="208,208 208,168 168,168 168,144 128,144"/>
  </g>

  <!-- Circuit trace endpoints (pads) -->
  <g fill="#39ff88">
    <rect x="44" y="44" width="8" height="8"/>
    <rect x="204" y="44" width="8" height="8"/>
    <rect x="44" y="204" width="8" height="8"/>
    <rect x="204" y="204" width="8" height="8"/>
    <rect x="124" y="20" width="8" height="8"/>
  </g>

  <!-- Keyhole cutout: dark interior shape cut from circuit -->
  <g>
    <!-- Keyhole shape: circle top + trapezoid bottom -->
    <path d="M128,68 
             A20,20 0 1,0 128,108 
             L118,140 
             L138,140 
             Z" 
          fill="#0b0f14" 
          stroke="#c8d3dc" 
          stroke-width="2.5"/>
  </g>

  <!-- Terminal caret intersecting the keyhole -->
  <g fill="#ffb000">
    <!-- Caret block (thick, terminal-style) -->
    <polygon points="110,100 128,82 146,100 146,108 128,90 110,108"/>
    <polygon points="110,108 128,90 146,108 146,116 128,98 110,116"/>
  </g>

  <!-- Caret highlight / bright accent -->
  <g fill="#39ff88" opacity="0.85">
    <polygon points="118,104 128,94 138,104 128,114"/>
  </g>

  <!-- Monospace-style terminal cursor bar -->
  <rect x="120" y="118" width="16" height="4" fill="#ffb000"/>

  <!-- Small technical tick marks for terminal feel -->
  <g stroke="#c8d3dc" stroke-width="1.5" opacity="0.5">
    <line x1="108" y1="124" x2="108" y2="130"/>
    <line x1="148" y1="124" x2="148" y2="130"/>
    <line x1="116" y1="134" x2="140" y2="134"/>
  </g>

  <!-- Corner registration marks (technical/illicit feel) -->
  <g stroke="#c8d3dc" stroke-width="1.5" opacity="0.4">
    <polyline points="16,24 16,16 24,16" fill="none"/>
    <polyline points="232,16 240,16 240,24" fill="none"/>
    <polyline points="16,232 16,240 24,240" fill="none"/>
    <polyline points="240,232 240,240 232,240" fill="none"/>
  </g>

  <!-- Wordmark (small, bottom) -->
  <text x="128" y="244" 
        font-family="'Courier New', monospace" 
        font-size="9" 
        fill="#c8d3dc" 
        text-anchor="middle" 
        opacity="0.6"
        letter-spacing="2">ps-activation-script-4478</text>
</svg>
